	  <form action="Form.html" id="myForm" method="get">
		  <fieldset> 
		  		<legend>Registration Form </legend>
				<table>
					   <tr><!-- creates row -->
					   	   <td><label for="name">User Name:</label>  </td><!--creates cell> -->
					   	   <td><input type="text"  id="name" name="name"> </td>
						</tr>
					<tr>
						<td><label for="password">Password:</label></td>
						<td><input type="password" id="password" name="password"></td>
					</tr>
					<tr>
						<td><label for="retype">Re-Type Password:</label></td>
						<td><input type="password" id="retype" name="retype"></td>
					</tr>	
					<tr>
						<td><label for="email">Email Address:</label></td>
						<td><input type="text" name="email" id="email" class="emailstyle"> </td>
					</tr>	
					<tr>
						<td><label for="age">Age:</label></td>
						<td><select name="age" id="age" >
									<option value="ageGroup0">---</option>
									<option value="ageGroup1">0-18</option>
									<option value="ageGroup2">18-30</option>
									<option value="ageGroup3">30-50</option>
									<option value="ageGroup4">50+</option>				 
								</select>
						</td>
					</tr>	
					<tr>
						<td><label>Sex:</label></td>
						<td><input type="radio" name="sex" id="sexm"  value="male">    <label class="radiobuttonlabel" for="sexm">Male</label></td>		
					</tr>
					<tr>
						<td></td>
						<td><input type="radio" name="sex"  value="female" id="sexf">   <label class="radiobuttonlabel" for="sexf"> __Female   </label></td>
					</tr>
					<tr>
						<td><label for="term">I accept the <a href="statement page.html">terms and cond.</a></label></td>
						<td><input type="checkbox" name="term" id="term" value="accepted"></td>
					</tr>
					<tr>
						<td></td>
						<td ><input type="submit" id="submit" name="submit" value="Submit"></td>
					</tr>
			</table>
